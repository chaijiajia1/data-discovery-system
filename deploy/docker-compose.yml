# 外网演示部署：app（FastAPI，假数据）+ caddy（HTTPS 入口）。
#   cp demo.env.example demo.env ; echo "DOMAIN=demo.example.com" > .env ; docker compose up -d --build
name: dd-demo

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ./demo.env
    restart: unless-stopped
    expose: ["8080"]
    networks: [backend]            # 只接内部网络：容器没有任何出站网络（演示只用假数据，不需要）
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # 证书，必须持久化（否则每次重启都重新申请，会触发限频）
      - caddy_config:/config
    networks: [edge, backend]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  edge: {}
  backend:
    internal: true                 # 无出站

volumes:
  caddy_data: {}
  caddy_config: {}
