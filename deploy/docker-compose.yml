# 外网演示部署（HTTPS）：app（FastAPI，假数据）+ caddy（自动 HTTPS 入口，需要域名）。
#   cp .env.example .env ; 编辑 DOMAIN ; ./install.sh https
# 没有域名 / 只想用 IP:端口 访问：用 docker-compose.http.yml（./install.sh http）。
# 镜像名由 DD_IMAGE 决定：本机构建后 `docker save` 拷到别的服务器 `docker load` 即可，服务器不需要源码、不需要联网构建。
name: dd-demo

services:
  app:
    image: ${DD_IMAGE:-dd-demo:latest}     # 构建配置在 docker-compose.build.yml（只有源码在场时才叠加；离线包里没有）
    env_file: ./demo.env
    restart: unless-stopped
    expose: ["8080"]
    networks: [backend]            # 只接内部网络：容器没有任何出站网络（演示只用假数据，不需要）
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    # 健康检查在镜像里（Dockerfile HEALTHCHECK）

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # 证书，必须持久化（否则每次重启都重新申请，会触发限频）
      - caddy_config:/config
    networks: [edge, backend]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  edge: {}
  backend:
    internal: true                 # 无出站

volumes:
  caddy_data: {}
  caddy_config: {}
